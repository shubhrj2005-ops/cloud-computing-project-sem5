# ── private-cloud: flask-deployment.yaml ───────────────────────────────────
# Identical to the main manifest; the cluster context switch is done by
# the failover PowerShell script, NOT by changing this file.
# ───────────────────────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-visitor-counter
  labels:
    app: flask-visitor-counter
    environment: private-cloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-visitor-counter
  template:
    metadata:
      labels:
        app: flask-visitor-counter
        environment: private-cloud
    spec:
      containers:
      - name: flask-app
        image: visitor-counter:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        env:
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        - name: APP_TITLE
          value: "Cloud Visitor Counter [PRIVATE]"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 20
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /ready
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: flask-service
  labels:
    environment: private-cloud
spec:
  type: NodePort
  selector:
    app: flask-visitor-counter
  ports:
  - port: 80
    targetPort: 5000
    nodePort: 30000
